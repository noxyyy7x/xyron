<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>XYRON - Register</title><link rel="stylesheet" href="/static/style.css"><link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/brand/favicon-16.png">
<link rel="shortcut icon" href="/static/brand/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/brand/apple-touch-icon.png">
<link rel="manifest" href="/static/brand/site.webmanifest">
<link rel="stylesheet" href="/static/brand/brand.css">
<link rel="stylesheet" href="/static/brand/theme.css">
<script src="/static/brand/theme.js" defer></script>
</head>
<body><main>
<h1 class="logo"><img src="/static/brand/logo-full.webp" alt="XYRON" width="260" height="239"></h1><p class="sub">Request an account</p>
<form id="f">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" required>
<label for="pw1">Password (at least 14 characters)</label>
<input id="pw1" type="password" autocomplete="new-password" minlength="14" required>
<label for="pw2">Repeat password</label>
<input id="pw2" type="password" autocomplete="new-password" minlength="14" required>
<button type="submit">Register</button>
<div id="msg" class="msg"></div>
</form>
<p class="sub foot">Already approved? <a href="/login">Sign in</a></p>
<script src="/static/register.js"></script>
</main></body></html>
